name: Build and deploy frontend

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

env:
    CONTAINER_NAME: redefinance_frontend

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
          contents: read
          packages: write

        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container registry
              uses: docker/login-action@v3
              with:
                registry: "ghcr.io"
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              id: push
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: ghcr.io/mepo-projects/${{ env.CONTAINER_NAME }}:${{ github.sha }}
                cache-from: type=registry,ref=ghcr.io/mepo-projects/${{ env.CONTAINER_NAME }}:buildcache
                cache-to: type=registry,ref=ghcr.io/mepo-projects/${{ env.CONTAINER_NAME }}:buildcache,mode=max

            - name: Send message
              uses: tsickert/discord-webhook@v7.0.0
              with:
                webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
                content: "Built ${{ env.CONTAINER_NAME }}"

            - name: Send message on failure
              if: failure()
              uses: tsickert/discord-webhook@v7.0.0
              with:
                webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
                content: "Failed last build of ${{ env.CONTAINER_NAME }}, checkout ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    deploy:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Install yq
              run: sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq && sudo chmod +x /usr/local/bin/yq

            - name: Setup Git
              run: |
                git config --global user.name "github-actions[bot]"
                git config --global user.email "github-actions[bot]@users.noreply.github.com"

            - uses: actions/checkout@v4
              with:
                repository: aminbabin/gitops-server
                token: ${{ secrets.GITOPS_PAT}}
                ref: main

            - name: Change version
              run: yq -i '.services.redefinance_frontend.image = "ghcr.io/mepo-projects/${{ env.CONTAINER_NAME }}:${{ github.sha }}"' server.yaml
           
            - name: Commit and push changes
              run: |
                git add .
                git diff --cached --quiet || git commit -m "chore: commit changes from CI pipeline"
                git push origin main
              env:
                GITHUB_TOKEN: ${{ secrets.GITOPS_PAT }}
                
            - name: Send message
              uses: tsickert/discord-webhook@v7.0.0
              with:
                webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
                content: "Deployed ${{ env.CONTAINER_NAME }}:${{ github.sha }}"

            - name: Send message on failure
              if: failure()
              uses: tsickert/discord-webhook@v7.0.0
              with:
                webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
                content: "Failed deployment of ${{ env.CONTAINER_NAME }}, checkout ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
